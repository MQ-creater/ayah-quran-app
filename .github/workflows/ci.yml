name: Ayah quality checks

permissions:
  contents: read

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  expo-web-build:
    name: Expo web export
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        run: npm install
      - name: Align Expo packages with the installed SDK
        run: npx expo install --fix
      - name: Run project regression checks
        run: npm run check
      - name: Export web preview
        run: npx expo export --platform web
      - name: Save web preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: ayah-web-preview
          path: dist/
          if-no-files-found: error
          retention-days: 7

  backend-check:
    name: Backend syntax and dependency check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check backend syntax
        run: node --check server/index.js
      - name: Install backend dependencies
        run: npm install --prefix server
